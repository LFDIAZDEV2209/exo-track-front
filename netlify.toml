[build]
  command = "pnpm run build --webpack"
  publish = ".next"

[build.environment]
  # >=22: el Corepack de Node 20 no verifica la firma de pnpm 10 (packageManager)
  # y tumba el install. No bajar de 22.
  NODE_VERSION = "22"
  NETLIFY_BUILD_DEBUG = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"
